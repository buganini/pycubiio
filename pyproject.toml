[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pycubiio"
version = "202611221"
description = "Original Cubiio laser engraver (1st gen) over BLE with a brother_ql-inspired API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "Pillow>=10",
    "click>=8.1",
    "QPUIQ>=1.11",
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pycubiio = "pycubiio.cli:cli"
pycubiio-gui = "pycubiio.ui:main"

[tool.setuptools]
packages = ["pycubiio", "pycubiio.backends"]
